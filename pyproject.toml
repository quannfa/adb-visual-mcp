[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adb-visual-mcp"
version = "0.1.0"
description = "Stateless pure-visual Android control MCP server over adb shell"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "mcp>=2.1.1,<3",
  "pydantic>=2,<3",
  "Pillow>=10",
]

[project.scripts]
adb-visual-mcp = "adb_visual_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adb_visual_mcp"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
